services:
  - type: cron
    name: waymo-counter
    runtime: python
    schedule: "*/30 * * * *"
    buildCommand: pip install -r requirements.txt && python scripts/download_model.py
    startCommand: python -u -m src.main
    plan: pro
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: MODEL_URL
        value: https://github.com/EthanMcKanna/waymo-counter/releases/download/v1.0/best.pt
      - key: CONFIDENCE_THRESHOLD
        value: "0.50"
      - key: FETCH_WORKERS
        value: "16"
      - key: SCAN_SCOPE
        value: "all"
      - key: ENABLED_MARKETS
        value: "austin,san_antonio,dallas,houston,atlanta,orlando,miami,phoenix"
