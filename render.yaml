services:
  - type: cron
    name: waymo-counter
    runtime: python
    schedule: "*/30 * * * *"
    buildCommand: pip install -r requirements.txt && python scripts/download_model.py
    startCommand: python -u -m src.main
    plan: pro
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: MODEL_URL
        value: https://github.com/EthanMcKanna/waymo-counter/releases/download/v1.1/best.pt
      - key: MODEL_IMAGE_SIZE
        value: "640"
      - key: CONFIDENCE_THRESHOLD
        value: "0.70"
      - key: VERIFIER_ENABLED
        value: "true"
      - key: VERIFIER_MODEL_URL
        value: https://github.com/EthanMcKanna/waymo-counter/releases/download/v1.2/verifier.torchscript.pt
      - key: VERIFIER_IMAGE_SIZE
        value: "224"
      - key: VERIFIER_CROP_PADDING
        value: "0.35"
      - key: VERIFIER_CALIBRATION_ENABLED
        value: "true"
      - key: VERIFIER_THRESHOLD
        value: "0.43"
      - key: VERIFIER_NON_AUSTIN_THRESHOLD
        value: "0.50"
      - key: FETCH_WORKERS
        value: "16"
      - key: SCAN_LOCK_MINUTES
        value: "120"
      - key: SCAN_SCOPE
        value: "all"
      - key: ENABLED_MARKETS
        value: "austin,san_antonio,dallas,houston,atlanta,orlando,miami,phoenix"
